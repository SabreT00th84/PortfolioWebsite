# .github/workflows/preview.yml
name: Deploy PR previews

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        if: github.event.action != 'closed'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false

      - name: Build Jekyll Site
        if: github.event.action != 'closed'
        run: |
          bundle exec jekyll build --baseurl "/staging-pr-views/pr-${{ github.event.number }}"

      - name: Deploy preview
        uses: rossjrw/pr-preview-action@v1
        with:
          preview-branch: main
          pages-base-url: https://eesaadam.me
          wait-for-pages-deployment: true
          qr-code: true
