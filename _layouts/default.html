<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ '/CSS/reset.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/CSS/global.css' | relative_url }}">
    {% if page.extra_css %}
        <link rel="stylesheet" href="{{ page.extra_css | relative_url }}">
    {% endif %}
    <script src="{{ /JS/mobileHeader.js | relative_url }}" defer></script>
    <title>{{ site.title }} | {{ page.title }}</title>
</head>
<body>
    {{ %include header.html }}
    <main>
        {{ content }}
    </main>
    {{ %include footer.html }}
</body>
</html>
